<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{subject}</title>
</head>
<!-- Inline styles only: placeholders use {key} interpolation, so avoid CSS blocks with braces -->
<body style="margin:0;padding:0;background-color:#f0f4f8;font-family:Helvetica,Arial,sans-serif;color:#333333;">
  <div style="max-width:600px;margin:0 auto;padding:20px;">
    <div style="background-color:#ffffff;border-radius:8px;padding:32px;">
      <h1 style="margin:0 0 16px;font-size:24px;color:#111111;">Chào mừng {name}!</h1>
      <p style="margin:0 0 12px;font-size:16px;line-height:24px;">Cảm ơn bạn đã tham gia {appName}. Tài khoản của bạn đã sẵn sàng.</p>
      <p style="margin:0 0 12px;font-size:16px;line-height:24px;">Bạn có thể đăng nhập trên ứng dụng di động hoặc trang web.</p>
      <p style="margin:24px 0 0;font-size:14px;line-height:20px;color:#666666;">Nếu bạn không tạo tài khoản này, vui lòng liên hệ bộ phận hỗ trợ.</p>
    </div>
    <p style="margin:16px 0 0;text-align:center;font-size:12px;color:#999999;">&copy; {appName}</p>
  </div>
</body>
</html>
