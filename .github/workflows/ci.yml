name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    environment: staging
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pwd
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d app_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v3

      - name: Create .env file for tests
        run: |
          echo "${{ secrets.ENV_FILE_CONTENT }}" > .env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm --frozen-lockfile --non-interactive

      - name: Run Prisma Migrations
        run: pnpm db:deploy
        env:
          DATABASE_DEBUG: false
          DATABASE_LAZY: true
          DATABASE_MIGRATE: true
          DATABASE_URL: postgresql://test_user:test_pwd@localhost:5432/app_test

      - name: Run Tests
        run: pnpm test
        env:
          DATABASE_DEBUG: false
          DATABASE_LAZY: true
          DATABASE_MIGRATE: true
          CACHE_REDIS_URL: redis://localhost:6379
          QUEUE_REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://test_user:test_pwd@localhost:5432/app_test
