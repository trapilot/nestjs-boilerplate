services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: ./ci/Dockerfile
    image: api-img:1.0.0
    networks:
      - app-network
    ports:
      - 3000:3000
    volumes:
      - ./logs:/app/logs
      - ./public:/app/public
      - ./private:/app/private
    env_file:
      - ./.env
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
  postgres:
    image: pgvector/pgvector:pg18
    container_name: postgres
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      # Postgres 18 images keep data in /var/lib/postgresql/18/docker; mount the parent
      - ./.data/postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: valkey/valkey:8
    container_name: redis
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "6379:6379"
    volumes:
      - ./.data/valkey8:/data
    command: ["valkey-server", "--appendonly", "yes"]
networks:
  app-network:
    external: true

